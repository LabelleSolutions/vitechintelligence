name: Post-merge hardening

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/post-merge-hardening
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh package lock metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate Cloudflare deployment
        run: npx wrangler deploy --dry-run

      - name: Commit refreshed package lock
        if: github.actor != 'github-actions[bot]'
        continue-on-error: true
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh package lock metadata [skip ci]"
          git push origin HEAD:fix/post-merge-hardening
