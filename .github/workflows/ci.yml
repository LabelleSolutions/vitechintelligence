name: Post-merge hardening

on:
  push:
    branches:
      - fix/post-merge-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Refresh package lock metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed package lock
        if: github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh package lock metadata [skip ci]"
          git push

      - name: Install exact dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate Cloudflare deployment
        run: npx wrangler deploy --dry-run
